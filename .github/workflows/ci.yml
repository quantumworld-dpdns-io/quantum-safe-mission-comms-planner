name: Quantum-Safe Mission Comms Planner CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black bandit safety
        pip install -r requirements.txt
    - name: Lint with flake8
      run: flake8 src tests
    - name: Format check with black
      run: black --check src tests
    - name: Security scan with Bandit
      run: bandit -r src
    - name: Dependency scan with Safety
      run: safety check

  test:
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run unit tests
      run: pytest tests/unit
    - name: Start API and run Robot tests
      run: |
        uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        robot tests/robot/functional/tests.robot
        robot tests/robot/security/tests.robot

  deploy-preview:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dev'
    steps:
    - name: Deploy to Staging/Preview
      run: echo "Deploying to preview environment..."
