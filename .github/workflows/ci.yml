name: CI/CD Pipeline for Quantum Safe Mission Communications Planner

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: '3.11'
  QISKIT_VERSION: '0.45.0'
  OQS_VERSION: '0.10.0'

jobs:
  # Quantum Build and Test
  quantum-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Validate OpenQASM circuits
        run: |
          python -m py_compile src/quantum/circuits/*.qasm || echo "QASM files don't need compilation, validating syntax..."
          # Simple QASM validation
          for file in src/quantum/circuits/*.qasm; do
            echo "Validating $file"
            head -5 "$file" | grep -q "OPENQASM" || echo "Warning: $file may not be valid QASM"
          done
      
      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v
      
      - name: Run Robot Framework functional tests
        run: |
          robot --outputdir reports/functional tests/robot/functional/
      
      - name: Run Robot Framework security tests (OWASP Top 10)
        run: |
          robot --outputdir reports/security tests/robot/security/
      
      - name: Run Robot Framework performance tests
        run: |
          robot --outputdir reports/performance tests/robot/performance/
      
      - name: Collect test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
      
      - name: Test coverage
        run: |
          python -m pytest tests/unit/ --cov=src --cov-report=xml --cov-report=term-missing
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quantum-build-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install security tools
        run: |
          pip install bandit safety owasp-zap-v2.5
      
      - name: Run Bandit security scan
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
      
      - name: Run Safety dependency check
        run: |
          safety check --json > safety-report.json || true
      
      - name: Run OWASP ZAP baseline scan
        run: |
          # Start ZAP daemon
          zap-baseline.py -t http://localhost:8080 -r zap-report.html || true
          echo "ZAP scan completed"
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            zap-report.html
    
  # Performance Benchmarking
  performance-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quantum-build-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run performance benchmarks
        run: |
          python -m pytest tests/performance/ -v --benchmark-only --benchmark-json=benchmark-report.json
      
      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: benchmark-report.json

  # Container Security Scan (if applicable)
  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quantum-build-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Trivy container scanner
        aquasecurity/trivy-action@0.23.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          security-checks: 'vuln,config'
      
      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports
          path: trivy-results.sarif
      
      - name: Upload SARIF results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif

  # Documentation Build
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quantum-build-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install documentation dependencies
        run: |
          pip install mkdocs mkdocs-material
      
      - name: Build documentation
        run: |
          mkdocs build --site-dir docs-build
      
      - name: Upload documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs-build

  # Deployment Preparation (staging)
  prepare-deploy-staging:
    runs-on: ubuntu-latest
    needs: [quantum-build-test, security-scan, performance-benchmark]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r src/ deploy/
          cp -r tests/ deploy/
          cp README.md deploy/
          cp requirements.txt deploy/
          cp requirements-dev.txt deploy/
          tar -czf quantum-safe-mission-comms-planner-staging.tar.gz deploy/
      
      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-package
          path: quantum-safe-mission-comms-planner-staging.tar.gz

# Scheduled nightly deep security scan
schedule:
  - cron: '0 2 * * *'  # 2 AM daily

  nightly-security-deep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install deep scanning tools
        run: |
          pip install bandit safety semgrep
          # Install additional quantum security tools if available
      
      - name: Run deep security scan with Semgrep
        run: |
          semgrep --config=p/ci --config=p/owasp-top10 --config=p/secrets -r src/ --output=semgrep-report.json || true
      
      - name: Run advanced Bandit scan
        run: |
          bandit -r src/ -lll -f json -o bandit-deep-report.json || true
      
      - name: Upload deep scan reports
        uses: actions/upload-artifact@v4
        with:
          name: deep-security-reports
          path: |
            semgrep-report.json
            bandit-deep-report.json

# Release workflow
release:
  needs: [quantum-build-test, security-scan, performance-benchmark, docs-build]
  runs-on: ubuntu-latest
  if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run final test suite
      run: |
        python -m pytest tests/unit/ -v
        robot --outputdir reports/final tests/robot/
    
    - name: Create release tag
      id: create_tag
      run: |
        VERSION=$(date +%Y.%m.%d-%H%M%S)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        git tag "v$VERSION"
        git push origin "v$VERSION"
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.create_tag.outputs.version }}
        name: Release ${{ steps.create_tag.outputs.version }}
        body: |
          Quantum Safe Mission Communications Planner
          Release ${{ steps.create_tag.outputs.version }}
          
          This release includes:
          - Updated quantum circuit simulations
          - Enhanced PQC integration
          - Comprehensive security testing
          - Performance improvements
        
        generate_release_notes: true
    
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          reports/
          docs-build/
        retention-days: 30