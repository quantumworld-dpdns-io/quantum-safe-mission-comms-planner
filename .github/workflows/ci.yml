name: Quantum-Safe Mission Comms Planner CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install flake8 black bandit safety
        pip install -r services/python/requirements.txt
    - name: Lint and Security Scan
      run: |
        flake8 services/python
        black --check services/python
        bandit -r services/python
    - name: Unit Tests
      run: pytest tests/unit

  go-lint-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    - name: Build Go Core
      run: cd services/go-core && go build -v ./...

  frontend-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install and Build
      run: |
        cd frontend
        npm install
        npm run build

  e2e-robot-tests:
    runs-on: ubuntu-latest
    needs: [python-lint-and-test, go-lint-and-build, frontend-check]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Environment
      run: |
        # Install Python deps for robot
        pip install -r services/python/requirements.txt
        pip install robotframework robotframework-requests
    - name: Start Microservices
      run: |
        # Start Python worker
        cd services/python && python api/main.py &
        # Start Go core
        cd services/go-core && go run main.go &
        sleep 10
    - name: Run Robot Tests
      run: |
        robot tests/robot/functional/tests.robot
        robot tests/robot/security/tests.robot
